<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>DOMprojects</title>
</head>
<body>
  <p>Youtube Subscribe Button</p>
  <button class="js-button subscribe-button">Subscribe</button>
  

  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 Shipping.</p>
  <p>Orders over $40 = FREE Shipping.</p>
  <input placeholder="Cost Of Order goes here" class="js-cost cost-area" onkeydown="handleCostKeyDown()">
  <button class="js-calculator calcbutton" ">Calculate</button>
  <p class="js-result"></p>
  <button class="js-changeit1">a</button>
  <button class="js-changeit2">b</button>
  <button class="heads">heads</button>
  <button class="tails">tails</button>
  <p class="js-output"></p>
  <input class="js-nameinput" placeholder="Your name here please..." onkeydown="handleNameKeyDown()">
  <button class="js-submit">Submit</button>

  <script src="java.js"></script>
</body>
</html>
