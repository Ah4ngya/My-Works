<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="html.css">
  <title>Document</title>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
    <button class="rock js-rock">
    <img src="rock-emoji.png" class="move-icon"></button>

    <button class="paper js-paper">
      <img src="paper-emoji.png" class="move-icon">
    </button>

    <button class="scissors js-scissors">
      <img src="scissors-emoji.png" class="move-icon">
    </button>
    <p class="js-resultofgame result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>
    <button class="reset js-reset">
      Reset Scores
    </button>
    <button class="auto-play-btn reset">Auto play</button>
    <p class="js-reset-conf"></p>

    

  <script src="html.js"></script>
</body>
</html>
