<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>
<body>
  <h4 >Cart Quantity:</h4>
  <button onclick="showQuantity()">Show Quantity</button>
  <button onclick="updateCartQuantity(1)">
    Add to Cart
  </button>
  <button onclick="updateCartQuantity(2)">
    +2
  </button>
  <button onclick="updateCartQuantity(3)">
    +3
  </button>
   <button onclick="updateCartQuantity(4)">
    +4
  </button>
   <button onclick="updateCartQuantity(5)">
    +5
  </button>
   <button onclick="updateCartQuantity(-1)">
    Remove 1 item
  </button>
  <button onclick="updateCartQuantity(-2)">
    Remove 2 item
  </button>
  <button onclick="updateCartQuantity(-3)">
    Remove 3 item
  </button>
  <p class="js-outputfield"></p>
  <button onclick="resetCart()">
    Reset Cart
  </button>

  


  
  <script src="java.js"></script>
</body>
</html>
